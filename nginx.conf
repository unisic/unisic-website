server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The site is built with Next.js `output: "export"` + `trailingSlash: true`,
    # so every route is emitted as <route>/index.html. try_files resolves the
    # clean URL to that directory's index.html; a request without the trailing
    # slash hits $uri/ and nginx 301-redirects to the canonical slashed URL.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets are immutable — cache them hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
