server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the Cloudflare tunnel nginx only sees http, so emit relative
    # redirects: the browser keeps the original https scheme and host instead
    # of being bounced to http://unisic.app/...
    absolute_redirect off;

    # adapter-static writes the docs and the locale pages as <route>/index.html
    # (trailingSlash 'always'). try_files resolves the clean URL to that
    # directory's index.html; a request without the trailing slash hits $uri/
    # and nginx 301-redirects to the canonical slashed URL.
    location / {
        try_files $uri $uri/ =404;
    }

    # The installer is a shell script, not a page: serve it as text so browsers
    # show it instead of downloading it, and always revalidate, because a stale
    # installer behind the Cloudflare tunnel is a real bug.
    location = /install.sh {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx:alpine's mime.types has no entry for the web app manifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hashed build assets are immutable, so cache them hard.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
